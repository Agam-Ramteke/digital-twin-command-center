apiVersion: v1
kind: ConfigMap
metadata:
  name: factory-twin-config
  namespace: factory-twin
data:
  PERSISTENCE_BACKEND: "mongo"
  MONGODB_URI: "mongodb://mongodb.factory-twin.svc.cluster.local:27017"
  MONGODB_DATABASE: "digital_twin"
  MQTT_HOST: "mosquitto.factory-twin.svc.cluster.local"
  MQTT_PORT: "1883"
  MQTT_LIVE_TWIN_ENABLED: "true"
  mosquitto.conf: |
    listener 1883 0.0.0.0
    protocol mqtt
    allow_anonymous true

    listener 9001 0.0.0.0
    protocol websockets
    allow_anonymous true

    persistence false
    log_dest stdout
    log_type error
    log_type warning
    log_type notice
    log_type information
